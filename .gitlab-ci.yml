stages:
  - check
  - build
  - image
  - deploy-config

default:
  image: registry.cn-hangzhou.aliyuncs.com/docker-test-dai/ganyi:golang_1.24
  interruptible: true
  before_script:
    - go version

variables:
  GOPROXY: "https://goproxy.cn"
  GOSUMDB: "off"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"

format-check:
  stage: check
  script:
    - gofmt -l api cmd internal
    - test -z "$(gofmt -l api cmd internal)"

build-manager:
  stage: build

  cache:
    key:
      prefix: "go-1.24-linux-amd64"
      files:
        - go.sum
    paths:
      - .cache/go/pkg/mod/
      - .cache/go-build/
    policy: pull-push

  script:
    - mkdir -p bin
    - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bin/manager ./cmd/main.go
    - ls -lah bin/manager

  artifacts:
    paths:
      - bin/manager
    expire_in: 7 days

docker-build-push:
  stage: image

  image: registry.cn-hangzhou.aliyuncs.com/docker-test-dai/docker:27

  interruptible: false

  needs:
    - job: build-manager
      artifacts: true

  variables:
    IMAGE_NAME: "$ALIYUN_REGISTRY/$ALIYUN_NAMESPACE/$ALIYUN_REPOSITORY"
    IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
    DOCKER_HOST: "unix:///var/run/docker.sock"

  before_script:
    - test -S /var/run/docker.sock
    - docker version
    - echo "$ALIYUN_PASSWORD" | docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_USERNAME" --password-stdin

  script:
    - echo "Build image ${IMAGE_NAME}:${IMAGE_TAG}"
    - test -f bin/manager

    - mkdir -p .ci-image-context
    - cp bin/manager .ci-image-context/manager
    - chmod +x .ci-image-context/manager

    - printf '%s\n' 'FROM scratch' 'WORKDIR /' 'COPY manager /manager' 'USER 65532:65532' 'ENTRYPOINT ["/manager"]' > .ci-image-context/Dockerfile

    - cat .ci-image-context/Dockerfile
    - ls -lah .ci-image-context

    - docker build -f .ci-image-context/Dockerfile -t "${IMAGE_NAME}:${IMAGE_TAG}" -t "${IMAGE_NAME}:latest" .ci-image-context

    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
    - docker push "${IMAGE_NAME}:latest"

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

update-kustomize-tag:
  stage: deploy-config

  image: registry.cn-hangzhou.aliyuncs.com/docker-test-dai/ganyi:golang_1.24

  interruptible: false

  needs:
    - job: docker-build-push

  before_script: []

  script:
    - git --version
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"

    - echo "Update kustomize image tag to ${CI_COMMIT_SHORT_SHA}"
    - grep -n "newTag" config/manager/kustomization.yaml
    - 'sed -i -E "s#newTag: .*#newTag: \"${CI_COMMIT_SHORT_SHA}\"#" config/manager/kustomization.yaml'
    - grep -n "newTag" config/manager/kustomization.yaml

    - git diff
    - git add config/manager/kustomization.yaml
    - 'git commit -m "deploy: update image tag ${CI_COMMIT_SHORT_SHA} [skip ci]" || echo "No manifest change"'

    - git push "http://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git" HEAD:main

  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
