stages:
  - check
  - build
  - image
  - deploy-config

default:
  image: golang:1.24
  interruptible: true

variables:
  GOPROXY: "https://goproxy.cn"
  GOSUMDB: "off"
  GOCACHE: "/tmp/go-build"

before_script:
  - go version

format-check:
  stage: check
  script:
    - gofmt -l api cmd internal
    - test -z "$(gofmt -l api cmd internal)"

build-manager:
  stage: build
  script:
    - go build -o bin/manager ./cmd/main.go
  artifacts:
    paths:
      - bin/manager
    expire_in: 7 days

docker-build-push:
  stage: image
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - docker version
    - echo "$ALIYUN_PASSWORD" | docker login "$ALIYUN_REGISTRY" -u "$ALIYUN_USERNAME" --password-stdin
  script:
    - export IMAGE_NAME="${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${ALIYUN_REPOSITORY}"
    - export IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
    - echo "Build image ${IMAGE_NAME}:${IMAGE_TAG}"
    - docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -t "${IMAGE_NAME}:latest" .
    - docker push "${IMAGE_NAME}:${IMAGE_TAG}"
    - docker push "${IMAGE_NAME}:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

update-kustomize-tag:
  stage: deploy-config
  image: golang:1.24
  needs:
    - docker-build-push
  before_script: []
  script:
    - git config user.name "gitlab-ci"
    - git config user.email "gitlab-ci@$CI_SERVER_HOST"
    - echo "Update kustomize image tag to ${CI_COMMIT_SHORT_SHA}"
    - grep -n "newTag" config/manager/kustomization.yaml
    - 'sed -i -E "s#newTag: .*#newTag: \"${CI_COMMIT_SHORT_SHA}\"#" config/manager/kustomization.yaml'
    - grep -n "newTag" config/manager/kustomization.yaml
    - git diff
    - git add config/manager/kustomization.yaml
    - 'git commit -m "deploy: update image tag ${CI_COMMIT_SHORT_SHA} [skip ci]" || echo "No manifest change"'
    - git push "http://${GITLAB_PUSH_USER}:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${CI_PROJECT_PATH}.git" HEAD:main
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'